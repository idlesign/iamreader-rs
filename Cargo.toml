[workspace]
members = ["crates/engine"]
resolver = "2"

[package]
name = "iamreader"
version = "0.2.0"
edition = "2021"
build = "build.rs"
default-run = "iamreader"

[features]
default = ["slint-ui"]
slint-ui = ["dep:slint", "dep:slint-build"]

[[bin]]
name = "iamreader"
path = "src/main.rs"
required-features = ["slint-ui"]

[[bin]]
name = "iamreader-headless"
path = "src/bin/iamreader-headless.rs"

[build-dependencies]
chrono = "0.4"
slint-build = { version = "1.14", optional = true }

[dependencies]
iamreader-engine = { path = "crates/engine", version = "0.2.0" }
slint = { version = "1.14", features = ["std"], optional = true }
log = { version = "0.4", features = ["std"] }
crossbeam-channel = "0.5"
anyhow = "1.0"
chrono = "0.4"
libc = "0.2"
ctrlc = "3.5"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.24"
serde_json = "1.0"
hound = "3.5"
